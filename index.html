<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Packing List</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0f0f13;
    --surface: #18181f;
    --border: #2a2a38;
    --accent: #6c63ff;
    --accent2: #a78bfa;
    --text: #e8e8f0;
    --muted: #6b6b80;
    --green: #34d399;
    --red: #f87171;
    --yellow: #fbbf24;
    --row-hover: #1e1e2a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
    min-height: 100vh;
  }

  header {
    border-bottom: 1px solid var(--border);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 16px;
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .logo {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent2);
  }

  .header-export-btn {
    display: flex;
    align-items: center;
    gap: 7px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1.5px solid var(--green);
    background: rgba(52,211,153,0.1);
    color: var(--green);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    margin-left: auto;
  }
  .header-export-btn:hover { background: rgba(52,211,153,0.22); }

  .tab-bar {
    display: flex;
    gap: 4px;
    background: var(--surface);
    padding: 4px;
    border-radius: 10px;
    margin-left: auto;
  }

  .tab {
    padding: 7px 18px;
    border-radius: 7px;
    border: none;
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.15s;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
  }

  .main { display: flex; height: calc(100vh - 57px); }

  /* LEFT PANEL */
  .sidebar {
    width: 300px;
    flex-shrink: 0;
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .upload-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 14px;
    border-radius: 8px;
    border: 1.5px dashed var(--border);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    font-size: 13px;
    transition: all 0.15s;
    width: 100%;
  }
  .upload-btn:hover { border-color: var(--accent); color: var(--accent2); }
  .upload-btn.loaded { border-color: var(--green); color: var(--green); border-style: solid; }

  .search-input {
    width: 100%;
    padding: 8px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    color: var(--text);
    font-size: 13px;
    outline: none;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus { border-color: var(--accent); }

  .article-list {
    overflow-y: auto;
    flex: 1;
    padding: 8px;
  }

  .article-item {
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    transition: background 0.1s;
  }
  .article-item:hover { background: var(--row-hover); }
  .article-item.selected { background: rgba(108,99,255,0.15); }

  .article-code {
    font-size: 13px;
    font-weight: 600;
    font-family: 'Courier New', monospace;
    color: var(--text);
  }
  .article-qty {
    font-size: 12px;
    font-weight: 700;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 2px 8px;
    color: var(--muted);
    flex-shrink: 0;
  }

  /* RIGHT PANEL */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
  }

  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 60%;
    gap: 12px;
    color: var(--muted);
    text-align: center;
  }
  .empty-state .icon { font-size: 48px; opacity: 0.4; }
  .empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text); }
  .empty-state p { font-size: 13px; max-width: 280px; line-height: 1.6; }

  .article-detail h2 {
    font-size: 22px;
    font-weight: 700;
    font-family: 'Courier New', monospace;
    color: var(--accent2);
    margin-bottom: 6px;
  }

  .detail-meta {
    display: flex;
    gap: 12px;
    align-items: center;
    margin-bottom: 24px;
  }

  .tag {
    padding: 3px 10px;
    border-radius: 5px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .tag-cat { background: rgba(108,99,255,0.2); color: var(--accent2); }
  .tag-type { background: rgba(52,211,153,0.1); color: var(--green); }

  .size-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 28px;
  }

  .size-card {
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 14px 18px;
    min-width: 90px;
    text-align: center;
    transition: border-color 0.15s;
  }
  .size-card:hover { border-color: var(--accent); }

  .size-label {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .size-qty {
    font-size: 26px;
    font-weight: 800;
    color: var(--text);
    line-height: 1;
  }

  .total-block {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: rgba(108,99,255,0.1);
    border: 1px solid rgba(108,99,255,0.3);
    border-radius: 10px;
    padding: 12px 20px;
    margin-bottom: 28px;
  }
  .total-block .total-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; }
  .total-block .total-num { font-size: 28px; font-weight: 800; color: var(--accent2); }

  /* EXPORT BUTTONS */
  .export-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 9px 18px;
    border-radius: 8px;
    border: 1.5px solid var(--accent);
    background: rgba(108,99,255,0.12);
    color: var(--accent2);
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
  }
  .export-btn:hover { background: rgba(108,99,255,0.25); }
  .export-all-btn { border-color: var(--green); background: rgba(52,211,153,0.08); color: var(--green); }
  .export-all-btn:hover { background: rgba(52,211,153,0.18); }

  /* FLAT TABLE */
  .flat-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  .flat-table th {
    text-align: left;
    padding: 10px 14px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.09em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 2px solid var(--border);
    background: var(--surface);
  }
  .flat-table td {
    padding: 11px 14px;
    border-bottom: 1px solid rgba(42,42,56,0.6);
  }
  .flat-table tr:hover td { background: var(--row-hover); }
  .flat-table tfoot td { border-top: 2px solid var(--border); border-bottom: none; background: var(--surface); }
  .size-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 5px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--text);
  }
  .qty-cell {
    font-weight: 800;
    font-size: 15px;
    color: var(--text);
    font-family: 'Courier New', monospace;
  }

  /* BOX BREAKDOWN */
  .section-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }

  .box-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-bottom: 32px;
  }
  .box-table th {
    text-align: left;
    padding: 8px 12px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }
  .box-table td {
    padding: 9px 12px;
    border-bottom: 1px solid rgba(42,42,56,0.5);
    font-family: 'Courier New', monospace;
  }
  .box-table tr:hover td { background: var(--row-hover); }
  .box-table .num-cell { color: var(--accent2); font-weight: 700; }

  /* INVOICE TAB */
  .invoice-zone {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 48px;
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background: var(--surface);
    margin-bottom: 24px;
  }
  .invoice-zone:hover, .invoice-zone.drag-over {
    border-color: var(--accent);
    background: rgba(108,99,255,0.05);
  }
  .invoice-zone .big-icon { font-size: 52px; margin-bottom: 12px; opacity: 0.5; }
  .invoice-zone h3 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .invoice-zone p { font-size: 13px; color: var(--muted); }

  .invoice-preview {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }

  .invoice-toolbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }

  .inv-filename {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    flex: 1;
    font-family: 'Courier New', monospace;
  }

  .btn-sm {
    padding: 6px 14px;
    border-radius: 7px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent2); }
  .btn-danger { border-color: rgba(248,113,113,0.3); color: var(--red); }
  .btn-danger:hover { border-color: var(--red); background: rgba(248,113,113,0.08); }

  .invoice-table-wrap {
    overflow-x: auto;
    max-height: 500px;
    overflow-y: auto;
  }

  .invoice-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
    min-width: 600px;
  }
  .invoice-table th {
    position: sticky;
    top: 0;
    background: var(--surface);
    padding: 8px 10px;
    text-align: left;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    z-index: 1;
  }
  .invoice-table td {
    padding: 7px 10px;
    border-bottom: 1px solid rgba(42,42,56,0.5);
    font-family: 'Courier New', monospace;
    color: var(--text);
  }
  .invoice-table tr:hover td { background: var(--row-hover); }

  .stats-row {
    display: flex;
    gap: 14px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }

  .stat-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 20px;
    flex: 1;
    min-width: 140px;
  }
  .stat-card .s-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.07em; margin-bottom: 6px; }
  .stat-card .s-val { font-size: 22px; font-weight: 800; color: var(--text); }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width: 5px; height: 5px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }

  .no-data { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }

  input[type=file] { display: none; }
</style>
</head>
<body>

<header>
  <div class="logo">📦 Packing List</div>
  <button class="header-export-btn" id="btn-export-all" onclick="exportAll()" style="display:none">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
    Выгрузить весь список
  </button>
  <div class="tab-bar">
    <button class="tab active" onclick="switchTab('packing')">Паккинг лист</button>
    <button class="tab" onclick="switchTab('invoice')">Инвойс</button>
  </div>
</header>

<div class="main" id="app">

  <!-- PACKING TAB -->
  <div id="tab-packing" style="display:flex;flex:1;overflow:hidden;">
    <aside class="sidebar">
      <div class="sidebar-header">
        <button class="upload-btn" id="btn-upload-pl" onclick="document.getElementById('file-pl').click()">
          <span>📂</span> <span id="pl-label">Загрузить паккинг лист (.xlsx)</span>
        </button>
        <input type="file" id="file-pl" accept=".xlsx,.xls" onchange="loadPackingList(this)">
        <input class="search-input" id="search" placeholder="🔍 Поиск по артикулу..." oninput="filterArticles()" disabled>
      </div>
      <div class="article-list" id="article-list">
        <div class="no-data" style="padding:30px 16px;">Загрузите файл<br>паккинг листа</div>
      </div>
    </aside>

    <div class="content" id="detail-panel">
      <div class="empty-state">
        <div class="icon">👆</div>
        <h3>Выберите артикул</h3>
        <p>Загрузите паккинг лист и выберите артикул из списка слева, чтобы увидеть разбивку по размерам и коробкам.</p>
      </div>
    </div>
  </div>

  <!-- INVOICE TAB -->
  <div id="tab-invoice" style="display:none;flex:1;overflow:hidden;">
    <div class="content">
      <div id="invoice-upload-area">
        <div class="invoice-zone" id="inv-drop-zone"
          onclick="document.getElementById('file-inv').click()"
          ondragover="event.preventDefault();this.classList.add('drag-over')"
          ondragleave="this.classList.remove('drag-over')"
          ondrop="handleInvDrop(event)">
          <div class="big-icon">📄</div>
          <h3>Загрузите инвойс</h3>
          <p>Перетащите .xlsx / .xls файл сюда<br>или нажмите для выбора</p>
        </div>
        <input type="file" id="file-inv" accept=".xlsx,.xls" onchange="loadInvoice(this)">
      </div>
      <div id="invoice-content" style="display:none;"></div>
    </div>
  </div>

</div>

<script>
let packingData = []; // { article, category, sizes: {size: total}, boxes: [{box, sizes}] }
let selectedArticle = null;
let invoiceData = null;

// ======== TAB SWITCH ========
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  document.getElementById('tab-packing').style.display = tab === 'packing' ? 'flex' : 'none';
  document.getElementById('tab-invoice').style.display = tab === 'invoice' ? 'flex' : 'none';
}

// ======== PACKING LIST LOAD ========
function loadPackingList(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { defval: null });
    packingData = processPackingList(raw, file.name);
    renderArticleList(packingData);
    document.getElementById('btn-export-all').style.display = 'flex';
    document.getElementById('pl-label').textContent = file.name;
    document.getElementById('btn-upload-pl').classList.add('loaded');
    document.getElementById('search').disabled = false;
  };
  reader.readAsArrayBuffer(file);
}

function processPackingList(rows, filename) {
  // Detect size columns (everything between known fixed cols and QTY/last col)
  const fixed = ['ITEM NO.', 'ITEM NO', 'DEVISION', 'DIVISION', 'Unnamed: 2', 'QTY', 'Unnamed: 26'];
  const sample = rows[0] || {};
  const allCols = Object.keys(sample);
  const sizeCols = allCols.filter(c => !fixed.includes(c));

  // Detect category column
  const catCol = allCols.find(c => ['DEVISION','DIVISION','Unnamed: 2'].includes(c));
  const articleCol = allCols.find(c => c === 'ITEM NO.');
  const baseCol = allCols.find(c => c === 'ITEM NO');

  // Group by article
  const map = {};
  rows.forEach((row, idx) => {
    const art = row[articleCol] || row[baseCol] || `ROW_${idx}`;
    const baseArt = row[baseCol] || art;
    if (!map[art]) map[art] = { article: art, baseArticle: baseArt, category: row[catCol] || '', sizes: {}, boxes: [] };
    const entry = map[art];
    const boxSizes = {};
    sizeCols.forEach(sc => {
      if (row[sc] && !isNaN(row[sc]) && Number(row[sc]) > 0) {
        const qty = Number(row[sc]);
        entry.sizes[sc] = (entry.sizes[sc] || 0) + qty;
        boxSizes[sc] = qty;
      }
    });
    const boxQty = Object.values(boxSizes).reduce((a,b)=>a+b, 0);
    if (boxQty > 0) {
      entry.boxes.push({ index: entry.boxes.length + 1, sizes: boxSizes, qty: boxQty });
    }
  });
  return Object.values(map);
}

function renderArticleList(data) {
  const list = document.getElementById('article-list');
  if (!data.length) { list.innerHTML = '<div class="no-data">Данных нет</div>'; return; }
  list.innerHTML = data.map(item => {
    const total = Object.values(item.sizes).reduce((a,b)=>a+b,0);
    return `<div class="article-item" onclick="selectArticle('${item.article}')" id="ai-${esc(item.article)}">
      <span class="article-code">${item.article}</span>
      <span class="article-qty">${total}</span>
    </div>`;
  }).join('');
}

function filterArticles() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = q ? packingData.filter(d => d.article.toLowerCase().includes(q)) : packingData;
  renderArticleList(filtered);
}

function selectArticle(article) {
  selectedArticle = article;
  document.querySelectorAll('.article-item').forEach(el => el.classList.remove('selected'));
  const el = document.getElementById('ai-' + esc(article));
  if (el) el.classList.add('selected');
  const item = packingData.find(d => d.article === article);
  if (!item) return;
  renderDetail(item);
}

function renderDetail(item) {
  const total = Object.values(item.sizes).reduce((a,b)=>a+b,0);

  // Flat rows: one row per size, sorted
  const sizeOrder = ['FREE','XXS','XS','S','M','L','XL','XXL','3XL','4XL','5XL',
    '4','4.5','5','5.5','6','6.5','7','7.5','8','8.5','9','9.5','10','10.5','11','11.5','12','12.5','13','13.5','14','14.5','15'];
  const sortedSizes = Object.entries(item.sizes).sort(([a],[b]) => {
    const ai = sizeOrder.indexOf(String(a)), bi = sizeOrder.indexOf(String(b));
    if (ai === -1 && bi === -1) return String(a).localeCompare(String(b));
    if (ai === -1) return 1; if (bi === -1) return -1;
    return ai - bi;
  });

  const tableRows = sortedSizes.map(([size, qty], i) =>
    `<tr>
      <td style="color:var(--muted);font-size:12px;">${i+1}</td>
      <td><span style="font-family:'Courier New',monospace;font-weight:700;color:var(--accent2)">${item.article}</span></td>
      <td><span class="size-badge">${size}</span></td>
      <td class="qty-cell">${qty}</td>
    </tr>`
  ).join('');

  document.getElementById('detail-panel').innerHTML = `
    <div class="article-detail">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:20px;flex-wrap:wrap;">
        <div>
          <h2>${item.article}</h2>
          <div class="detail-meta" style="margin-bottom:0">
            <span class="tag tag-cat">${item.category || '—'}</span>
            <span class="tag tag-type">${item.boxes.length} коробок</span>
            <span class="tag" style="background:rgba(251,191,36,0.1);color:var(--yellow)">Итого: ${total} шт.</span>
          </div>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="export-btn" onclick="exportCurrentArticle()">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
            Выгрузить Excel
          </button>
          <button class="export-btn export-all-btn" onclick="exportAll()">
            <svg width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 10v6m0 0l-3-3m3 3l3-3M3 17V7a2 2 0 012-2h6l2 2h6a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>
            Весь список
          </button>
        </div>
      </div>

      <table class="flat-table">
        <thead>
          <tr>
            <th style="width:36px">#</th>
            <th>Артикул</th>
            <th>Размер</th>
            <th>Кол-во</th>
          </tr>
        </thead>
        <tbody>${tableRows}</tbody>
        <tfoot>
          <tr>
            <td colspan="3" style="text-align:right;font-weight:700;color:var(--muted);font-size:12px;padding:10px 12px;">ИТОГО</td>
            <td class="qty-cell" style="font-size:18px;color:var(--accent2)">${total}</td>
          </tr>
        </tfoot>
      </table>
    </div>`;
}

function exportCurrentArticle() {
  if (!selectedArticle) return;
  const item = packingData.find(d => d.article === selectedArticle);
  if (!item) return;
  const sizeOrder = ['FREE','XXS','XS','S','M','L','XL','XXL','3XL','4XL','5XL',
    '4','4.5','5','5.5','6','6.5','7','7.5','8','8.5','9','9.5','10','10.5','11','11.5','12','12.5','13','13.5','14','14.5','15'];
  const sorted = Object.entries(item.sizes).sort(([a],[b]) => {
    const ai = sizeOrder.indexOf(String(a)), bi = sizeOrder.indexOf(String(b));
    if (ai===-1&&bi===-1) return String(a).localeCompare(String(b));
    if (ai===-1) return 1; if (bi===-1) return -1; return ai-bi;
  });
  const wsData = [['Артикул','Размер','кол-во'], ...sorted.map(([s,q])=>[item.article, s, q])];
  downloadExcel(wsData, item.article);
}

function exportAll() {
  if (!packingData.length) return;
  const sizeOrder = ['FREE','XXS','XS','S','M','L','XL','XXL','3XL','4XL','5XL',
    '4','4.5','5','5.5','6','6.5','7','7.5','8','8.5','9','9.5','10','10.5','11','11.5','12','12.5','13','13.5','14','14.5','15'];
  const rows = [['Артикул','Размер','кол-во']];
  packingData.forEach(item => {
    const sorted = Object.entries(item.sizes).sort(([a],[b]) => {
      const ai = sizeOrder.indexOf(String(a)), bi = sizeOrder.indexOf(String(b));
      if (ai===-1&&bi===-1) return String(a).localeCompare(String(b));
      if (ai===-1) return 1; if (bi===-1) return -1; return ai-bi;
    });
    sorted.forEach(([s,q]) => rows.push([item.article, s, q]));
  });
  downloadExcel(rows, 'packing-list-full');
}

function downloadExcel(wsData, filename) {
  const ws = XLSX.utils.aoa_to_sheet(wsData);
  // Column widths
  ws['!cols'] = [{wch:20},{wch:10},{wch:10}];
  // Style header row bold (basic)
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Packing List');
  XLSX.writeFile(wb, filename.replace(/[^a-zA-Z0-9_\-А-Яа-я]/g,'_') + '.xlsx');
}

// ======== INVOICE LOAD ========
function handleInvDrop(e) {
  e.preventDefault();
  document.getElementById('inv-drop-zone').classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  readInvoiceFile(file);
}

function loadInvoice(input) {
  if (!input.files[0]) return;
  readInvoiceFile(input.files[0]);
}

function readInvoiceFile(file) {
  const reader = new FileReader();
  reader.onload = e => {
    const wb = XLSX.read(e.target.result, { type: 'array' });
    const ws = wb.Sheets[wb.SheetNames[0]];
    const raw = XLSX.utils.sheet_to_json(ws, { defval: '' });
    invoiceData = { filename: file.name, rows: raw, cols: raw.length ? Object.keys(raw[0]) : [] };
    renderInvoice(invoiceData);
  };
  reader.readAsArrayBuffer(file);
}

function renderInvoice(data) {
  document.getElementById('invoice-upload-area').style.display = 'none';
  const area = document.getElementById('invoice-content');
  area.style.display = 'block';

  const totalRows = data.rows.length;
  const totalCols = data.cols.length;
  const hasQty = data.cols.find(c => /qty|кол|количество/i.test(String(c)));
  const totalQty = hasQty ? data.rows.reduce((s,r) => s + (Number(r[hasQty])||0), 0) : null;

  const headCells = data.cols.map(c=>`<th>${c}</th>`).join('');
  const bodyRows = data.rows.slice(0,500).map(row =>
    `<tr>${data.cols.map(c=>`<td>${row[c] ?? ''}</td>`).join('')}</tr>`
  ).join('');
  const moreRows = totalRows > 500 ? `<tr><td colspan="${totalCols}" style="text-align:center;padding:12px;color:var(--muted)">... ещё ${totalRows-500} строк</td></tr>` : '';

  area.innerHTML = `
    <div class="stats-row">
      <div class="stat-card"><div class="s-label">Строк</div><div class="s-val">${totalRows}</div></div>
      <div class="stat-card"><div class="s-label">Колонок</div><div class="s-val">${totalCols}</div></div>
      ${totalQty !== null ? `<div class="stat-card"><div class="s-label">Итого кол-во</div><div class="s-val">${totalQty}</div></div>` : ''}
    </div>
    <div class="invoice-preview">
      <div class="invoice-toolbar">
        <span class="inv-filename">📄 ${data.filename}</span>
        <button class="btn-sm btn-danger" onclick="clearInvoice()">✕ Удалить</button>
      </div>
      <div class="invoice-table-wrap">
        <table class="invoice-table">
          <thead><tr>${headCells}</tr></thead>
          <tbody>${bodyRows}${moreRows}</tbody>
        </table>
      </div>
    </div>`;
}

function clearInvoice() {
  invoiceData = null;
  document.getElementById('invoice-content').style.display = 'none';
  document.getElementById('invoice-content').innerHTML = '';
  document.getElementById('invoice-upload-area').style.display = 'block';
  document.getElementById('file-inv').value = '';
}

function esc(s) { return String(s).replace(/[^a-zA-Z0-9_-]/g,'_'); }
</script>
